name: build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:

jobs:
  # The checks are main() programs that need an AWT toolkit but never show a
  # window, so on Linux they run under a virtual display.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - run: sudo apt-get install -y xvfb
      - run: xvfb-run -a ./gradlew check --continue --console=plain

  # jpackage only builds for the platform it runs on, so one job per platform.
  # The jar is the same everywhere; only the native bundle differs.
  package:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            bundle: build/jpackage/*.dmg
          - os: ubuntu-latest
            bundle: build/jpackage/*.deb
          - os: windows-latest
            bundle: build/jpackage/Cantordust
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - run: ./gradlew jar jpackage --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: cantordust-${{ matrix.os }}
          path: |
            build/libs/cantordust.jar
            ${{ matrix.bundle }}

  # A tag like v2.0.0 turns the artifacts into a GitHub release.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { path: artifacts }
      - run: |
          cd artifacts
          (cd cantordust-windows-latest && zip -qr ../Cantordust-windows.zip Cantordust)
          cp cantordust-ubuntu-latest/cantordust.jar ./cantordust.jar
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes \
            cantordust.jar Cantordust-windows.zip \
            cantordust-macos-latest/build/jpackage/*.dmg cantordust-ubuntu-latest/build/jpackage/*.deb
        env: { GH_TOKEN: '${{ github.token }}' }
